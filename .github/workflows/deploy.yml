name: Deploy to GitHub Pages

on:
  push:
    branches:
      - feat/add-lab-rax-models
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest push matters; an older in-flight deploy can be dropped.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The in-app source link points at the exact commit being deployed,
          # which is what AGPL-3.0 section 13 asks a public deployment to offer.
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
